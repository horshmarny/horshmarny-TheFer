<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<title>Horshmarny × TheFer*</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08070a;
    --blood:#c8102e;
    --blood-bright:#ff2a3f;
    --blood-glow:rgba(200,16,46,0.45);
    --text:#f5f5f7;
    --text-dim:#6a6a72;
    --text-faint:#3a3a42;
    --line:rgba(255,255,255,0.07);
    --panel:linear-gradient(180deg, #150c10 0%, #0e070a 100%);

    --name-size: clamp(30px, 10.5vw, 82px);
    --cross-size: clamp(22px, 5.5vw, 46px);
    --tag-size: clamp(9px, 2.2vw, 11px);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0}

  body{
    background:
      radial-gradient(ellipse 55% 40% at 50% 50%, rgba(200,16,46,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 50%, #12060a 0%, #08070a 55%, #030304 100%);
    background-color:#050405;
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    overflow:hidden;position:relative;
    min-height:100dvh;
    min-height:100vh;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .grid{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(ellipse 60% 60% at center, black 0%, transparent 85%);
            mask-image:radial-gradient(ellipse 60% 60% at center, black 0%, transparent 85%);
  }

  canvas#fx{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:2;
  }

  .corner{
    position:fixed;
    top:calc(env(safe-area-inset-top, 0px) + 18px);
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(8px, 2vw, 10px);
    letter-spacing:.28em;
    color:var(--text-faint);
    text-transform:uppercase;
    z-index:3;
    opacity:0;
    animation:fadeIn 1.2s ease 2.2s forwards;
    pointer-events:none;
  }
  .corner.left{left:calc(env(safe-area-inset-left, 0px) + 20px)}
  .corner.right{right:calc(env(safe-area-inset-right, 0px) + 20px)}

  /* ==== Страницы ==== */
  .page{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      calc(env(safe-area-inset-right, 0px) + 20px)
      calc(env(safe-area-inset-bottom, 0px) + 130px)
      calc(env(safe-area-inset-left, 0px) + 20px);
    z-index:4;
    opacity:0;
    pointer-events:none;
    transform: translateY(6px);
    transition: opacity .38s ease, transform .38s ease;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .page.active{
    opacity:1;
    pointer-events:auto;
    transform: translateY(0);
  }

  /* ==== ГЛАВНАЯ ==== */
  .names{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap: clamp(0px, 0.6vw, 4px);
    line-height:1;
    width:100%;
    max-width:920px;
  }

  .name{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:var(--name-size);
    letter-spacing:-0.045em;
    line-height:0.95;
    color:var(--text);
    display:block;
    white-space:nowrap;
    will-change:transform, opacity, filter;
  }
  .name.left{ animation: riseIn 1.1s cubic-bezier(.16,1,.3,1) .25s both }
  .name.right{ animation: riseIn 1.1s cubic-bezier(.16,1,.3,1) 1.15s both }

  @keyframes riseIn{
    0%{ opacity:0; transform: translateY(22px); filter: blur(14px) }
    100%{ opacity:1; transform: translateY(0); filter: blur(0) }
  }

  .star{
    color:var(--blood);
    text-shadow:0 0 24px var(--blood-glow);
    margin-left:.02em;
  }

  .cross{
    font-family:'Inter', sans-serif;
    font-weight:300;
    font-size:var(--cross-size);
    color:var(--blood);
    text-shadow:0 0 30px var(--blood-glow), 0 0 60px rgba(200,16,46,.25);
    line-height:1;
    display:block;
    margin: clamp(2px, 0.8vw, 8px) 0;
    opacity:0;
    animation:
      crossIn .9s cubic-bezier(.2,1.4,.3,1) .78s both,
      crossPulse 3.6s ease-in-out 1.9s infinite;
    will-change:transform, opacity;
  }
  @keyframes crossIn{
    0%{ opacity:0; transform: scale(.4); filter: blur(10px) }
    100%{ opacity:1; transform: scale(1); filter: blur(0) }
  }
  @keyframes crossPulse{
    0%,100%{ transform: scale(1); opacity:1 }
    50%{ transform: scale(1.06); opacity:.9 }
  }

  .divider{
    display:flex;align-items:center;
    gap:10px;
    width: clamp(160px, 42vw, 300px);
    margin-top: clamp(10px, 2.5vw, 22px);
    opacity:0;
    animation: fadeIn 1.2s ease 1.7s both;
  }
  .divider::before,
  .divider::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .divider .dot{
    width:3px;height:3px;border-radius:50%;
    background:var(--blood);
    box-shadow:0 0 8px var(--blood-glow);
  }

  .tagline{
    font-family:'JetBrains Mono', monospace;
    font-size:var(--tag-size);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--text-dim);
    opacity:0;
    animation: fadeIn 1.2s ease 2.0s both;
    padding-left:.42em;
  }

  @keyframes fadeIn{
    from{opacity:0; transform: translateY(6px)}
    to{opacity:1; transform: translateY(0)}
  }

  /* ==== ПРОФИЛЬ ==== */
  .profile-card{
    width: min(92vw, 420px);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.055);
    border-radius: 24px;
    padding: clamp(22px, 5vw, 32px) clamp(18px, 4.5vw, 28px);
    box-shadow:
      0 20px 50px rgba(0,0,0,0.55),
      0 0 0 1px rgba(200,16,46,0.05),
      inset 0 1px 0 rgba(255,255,255,0.035);
    position: relative;
    text-align:center;
  }
  .profile-card::before{
    content:'';
    position:absolute;top:0;left:20%;right:20%;height:1px;
    background:linear-gradient(90deg, transparent, rgba(200,16,46,.55), transparent);
  }

  /* --- Аватарка --- */
  .avatar-wrap{
    position: relative;
    width: clamp(78px, 22vw, 96px);
    height: clamp(78px, 22vw, 96px);
    margin: 0 auto 16px;
  }
  .avatar-ring{
    position:absolute;inset:-3px;
    border-radius:50%;
    background: conic-gradient(from 180deg, var(--blood) 0%, #2a0a12 40%, var(--blood-bright) 60%, #2a0a12 100%);
    -webkit-mask: radial-gradient(circle, transparent 0 calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(circle, transparent 0 calc(100% - 3px), #000 calc(100% - 3px));
    opacity:.9;
    filter: drop-shadow(0 0 14px rgba(200,16,46,.35));
  }
  .avatar{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background:#150c10;
    border:1px solid rgba(255,255,255,.06);
  }
  .avatar-fallback{
    position:absolute;inset:0;
    display:grid;place-items:center;
    border-radius:50%;
    background: linear-gradient(180deg, #2a0f16, #150c10);
    color: var(--blood);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: clamp(28px, 8vw, 34px);
    letter-spacing: -0.03em;
    border:1px solid rgba(255,255,255,.06);
    text-shadow: 0 0 20px var(--blood-glow);
  }

  /* --- Имя и роль --- */
  .profile-name{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: clamp(20px, 5.5vw, 26px);
    letter-spacing:-0.03em;
    color: var(--text);
    margin: 0 0 6px;
    line-height: 1.15;
    word-break: break-word;
  }
  .profile-role{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 99px;
    background: rgba(200,16,46,0.10);
    border: 1px solid rgba(200,16,46,0.28);
    color: var(--blood-bright);
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(9px, 2.2vw, 10.5px);
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .profile-role .role-dot{
    width:6px;height:6px;border-radius:50%;
    background: var(--blood-bright);
    box-shadow: 0 0 8px var(--blood-glow);
    animation: rolePulse 2.4s ease-in-out infinite;
  }
  @keyframes rolePulse{
    0%,100%{ opacity:1 }
    50%{ opacity:.4 }
  }

  /* --- Строки с данными --- */
  .profile-rows{
    display:flex;flex-direction:column;
    gap: 0;
    border-top: 1px solid var(--line);
    margin-top: 4px;
  }
  .prow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    font-size: clamp(12px, 3.2vw, 13.5px);
    text-align:left;
  }
  .pkey{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(9.5px, 2.4vw, 10.5px);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-faint);
    flex-shrink: 0;
  }
  .pval{
    font-weight: 500;
    color: var(--text);
    text-align:right;
    word-break: break-word;
    overflow:hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .pval.mono{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(11px, 3vw, 12.5px);
    letter-spacing: -.01em;
  }
  .pval.dim{ color: var(--text-dim); }
  .pval .copy-btn{
    background:none;border:none;color:inherit;
    font:inherit;padding:0;cursor:pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pval .copy-btn svg{
    width: 12px;height:12px;
    stroke: currentColor; stroke-width: 2;
    fill:none; stroke-linecap: round; stroke-linejoin: round;
    opacity:.5;
  }
  .pval .copy-btn:active svg{ opacity:1 }

  /* ==== ПУСТЫЕ СТРАНИЦЫ (Настройки) ==== */
  .page-header{
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(9px, 2.2vw, 11px);
    letter-spacing:.4em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom: 24px;
  }
  .page-title{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: clamp(28px, 8vw, 44px);
    letter-spacing:-0.04em;
    color:var(--text);
    margin: 0 0 12px;
  }
  .page-sub{
    font-size: clamp(12px, 3vw, 14px);
    color:var(--text-dim);
    max-width: 320px;
    line-height: 1.5;
  }

  /* ==== Лоадер ==== */
  .loader{
    position:fixed;
    bottom: clamp(110px, 18vh, 160px);
    left:50%; transform: translateX(-50%);
    display:flex;flex-direction:column;align-items:center;
    gap:12px;
    z-index:6;
    width: clamp(200px, 62vw, 340px);
    opacity:0;
    animation:
      fadeIn 1s ease .5s both,
      loaderOut .7s ease 3.05s forwards;
    pointer-events:none;
  }
  .loader-bar{
    width:100%;
    height:1px;
    background:rgba(255,255,255,0.06);
    position:relative;
    overflow:hidden;
  }
  .loader-fill{
    position:absolute;top:0;left:0;bottom:0;width:0;
    background: linear-gradient(90deg, transparent, var(--blood) 60%, var(--blood-bright));
    box-shadow:0 0 10px var(--blood-glow);
    animation: fillBar 3s cubic-bezier(.55,.05,.35,1) forwards;
  }
  @keyframes fillBar{
    0%{ width:0 }
    20%{ width:18% }
    50%{ width:52% }
    78%{ width:80% }
    100%{ width:100% }
  }
  .loader-meta{
    display:flex;justify-content:space-between;
    width:100%;
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(8px, 1.9vw, 10px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .loader-meta .pct{
    color:var(--blood);
    font-variant-numeric: tabular-nums;
  }
  @keyframes loaderOut{
    to{ opacity:0; transform: translateX(-50%) translateY(14px) }
  }

  /* ============================================================
     ==== НИЖНЕЕ МЕНЮ ==========================================
     ============================================================ */
  .tabbar{
    position:fixed;
    left:50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translate(-50%, 30px);
    width: min(92vw, 440px);
    display: flex;
    justify-content: space-around;
    align-items: stretch;
    gap: 4px;
    padding: 8px 6px;
    background: linear-gradient(180deg, #1a0f13 0%, #12080c 100%);
    border: 1px solid rgba(255,255,255,0.055);
    border-radius: 22px;
    box-shadow:
      0 16px 44px rgba(0,0,0,0.65),
      0 0 0 1px rgba(200,16,46,0.05),
      inset 0 1px 0 rgba(255,255,255,0.04);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,1,.3,1);
  }
  .tabbar.show{
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
  }

  .tab{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 2px;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease;
  }
  .tab:active{ transform: scale(.95) }

  .tab-icon{
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 12px;
    color: #fff;
    transition: background .28s ease, box-shadow .28s ease, color .28s ease;
  }
  .tab-icon svg{
    width: 22px; height: 22px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .tab-label{
    font-size: clamp(10px, 2.6vw, 11.5px);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff;
    opacity: .85;
    transition: opacity .25s ease;
  }

  .tab.active .tab-icon{
    background: linear-gradient(180deg, var(--blood-bright) 0%, var(--blood) 100%);
    box-shadow:
      0 8px 22px rgba(200,16,46,0.5),
      0 0 0 1px rgba(255,42,63,0.4),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .tab.active .tab-label{ opacity: 1; }

  /* ==== Адаптив ==== */
  @media (min-width:768px){
    :root{
      --name-size: clamp(56px, 7.5vw, 96px);
      --cross-size: clamp(36px, 4.5vw, 62px);
    }
  }

  @media (max-width:340px){
    :root{
      --name-size: clamp(26px, 9.8vw, 40px);
      --cross-size: 22px;
    }
    .tagline{letter-spacing:.3em;padding-left:.3em}
    .tabbar{padding: 6px 4px}
    .tab-icon{width: 34px; height: 34px}
    .tab-icon svg{width: 20px;height:20px}
  }

  @media (max-height:500px) and (orientation:landscape){
    :root{
      --name-size: clamp(24px, 6.5vh, 48px);
      --cross-size: clamp(18px, 4.5vh, 34px);
    }
    .loader{bottom: 84px}
    .corner{display:none}
    .page{padding-bottom: 100px}
    .tabbar{bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); padding: 4px 6px}
    .tab{gap: 2px; padding: 4px 2px}
    .tab-icon{width: 30px;height:30px;border-radius:10px}
    .tab-icon svg{width:18px;height:18px}
    .tab-label{font-size: 9.5px}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="grid"></div>
<canvas id="fx"></canvas>

<div class="corner left">N°01</div>
<div class="corner right">MMXXV</div>

<!-- ============ ГЛАВНАЯ ============ -->
<div class="page active" data-page="home">
  <div class="names">
    <div class="name left">Horshmarny</div>
    <div class="cross">×</div>
    <div class="name right">TheFer<span class="star">*</span></div>
  </div>
  <div class="divider"><span class="dot"></span></div>
  <div class="tagline">Collaboration</div>
</div>

<!-- ============ ПРОФИЛЬ ============ -->
<div class="page" data-page="profile">
  <div class="profile-card">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" id="avatar" alt="" style="display:none">
      <div class="avatar-fallback" id="avatarFallback">?</div>
    </div>

    <h2 class="profile-name" id="profileName">Загрузка…</h2>
    <div class="profile-role" id="profileRole">
      <span class="role-dot"></span>
      <span id="profileRoleText">Пользователь</span>
    </div>

    <div class="profile-rows">
      <div class="prow">
        <span class="pkey">ID</span>
        <span class="pval mono">
          <button class="copy-btn" id="copyId" type="button" title="Копировать">
            <span id="profileId">—</span>
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
        </span>
      </div>
      <div class="prow">
        <span class="pkey">Username</span>
        <span class="pval mono dim" id="profileUsername">—</span>
      </div>
      <div class="prow">
        <span class="pkey">Запуск бота</span>
        <span class="pval mono" id="profileStarted">—</span>
      </div>
      <div class="prow">
        <span class="pkey">Язык</span>
        <span class="pval mono dim" id="profileLang">—</span>
      </div>
    </div>
  </div>
</div>

<!-- ============ НАСТРОЙКИ ============ -->
<div class="page" data-page="settings">
  <div class="page-header">Section 03</div>
  <h1 class="page-title">Настройки</h1>
  <p class="page-sub">Уведомления, язык, тема оформления и прочие параметры приложения. Скоро.</p>
</div>

<!-- ============ ЛОАДЕР ============ -->
<div class="loader" id="loader">
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div class="loader-meta">
    <span>Loading</span>
    <span class="pct" id="pct">0%</span>
  </div>
</div>

<!-- ============ НИЖНЕЕ МЕНЮ ============ -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Навигация">
  <button class="tab active" data-tab="home" role="tab" aria-selected="true">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </span>
    <span class="tab-label">Главная</span>
  </button>

  <button class="tab" data-tab="profile" role="tab" aria-selected="false">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.1 3.6-7 8-7s8 2.9 8 7"/></svg>
    </span>
    <span class="tab-label">Профиль</span>
  </button>

  <button class="tab" data-tab="settings" role="tab" aria-selected="false">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.11 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/>
      </svg>
    </span>
    <span class="tab-label">Настройки</span>
  </button>
</nav>

<script>
(function(){
  /* ============================================================
     ==== НАСТРОЙКА РОЛЕЙ ======================================
     Укажи ID владельца и админов через запятую.
     ============================================================ */
  const OWNER_ID = 8552283918;                 // ← вписать Telegram ID владельца
  const ADMIN_IDS = [];               // ← вписать ID админов, напр. [123456, 789101]

  // ============================================================
  // ==== Telegram WebApp =======================================
  // ============================================================
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg){
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor && tg.setHeaderColor('#08070a'); } catch(e){}
    try { tg.setBackgroundColor && tg.setBackgroundColor('#08070a'); } catch(e){}
  }

  // ============================================================
  // ==== Заполнение профиля ====================================
  // ============================================================
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;

  function fillProfile(u){
    if (!u){
      // Вне Telegram — показываем демо-данные
      u = {
        id: 0,
        first_name: 'Гость',
        last_name: '',
        username: 'guest',
        language_code: 'ru',
        photo_url: ''
      };
    }

    // --- Аватарка ---
    const img = document.getElementById('avatar');
    const fb  = document.getElementById('avatarFallback');

    if (u.photo_url){
      img.src = u.photo_url;
      img.style.display = 'block';
      fb.style.display = 'none';
      img.onerror = () => {
        img.style.display = 'none';
        fb.style.display = 'grid';
      };
    } else {
      // инициалы
      const initials = ((u.first_name || '?')[0] + (u.last_name ? u.last_name[0] : '')).toUpperCase();
      fb.textContent = initials || '?';
    }

    // --- Имя ---
    const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ').trim() || 'Без имени';
    document.getElementById('profileName').textContent = fullName;

    // --- ID ---
    document.getElementById('profileId').textContent = u.id || '—';

    // --- Username ---
    const unameEl = document.getElementById('profileUsername');
    unameEl.textContent = u.username ? '@' + u.username : 'скрыт';

    // --- Язык ---
    const langMap = { ru:'Русский', en:'English', uk:'Українська', be:'Беларуская', kk:'Қазақша', de:'Deutsch', es:'Español', fr:'Français', tr:'Türkçe', it:'Italiano' };
    const langEl = document.getElementById('profileLang');
    langEl.textContent = langMap[u.language_code] || (u.language_code || '—').toUpperCase();

    // --- Роль ---
    const roleText = document.getElementById('profileRoleText');
    const roleBox  = document.getElementById('profileRole');
    if (u.id && OWNER_ID && u.id === OWNER_ID){
      roleText.textContent = 'Владелец';
      roleBox.style.background = 'rgba(200,16,46,0.18)';
      roleBox.style.borderColor = 'rgba(200,16,46,0.5)';
    } else if (u.id && ADMIN_IDS.includes(u.id)){
      roleText.textContent = 'Администратор';
    } else {
      roleText.textContent = 'Пользователь';
    }

    // --- Когда запустил бота ---
    const startEl = document.getElementById('profileStarted');
    let startedAt = null;

    // 1) URL-параметр ?started=2025-01-15T12:30:00Z или timestamp
    const url = new URL(location.href);
    const fromUrl = url.searchParams.get('started');
    if (fromUrl){
      const d = /^\d+$/.test(fromUrl) ? new Date(parseInt(fromUrl, 10) * 1000) : new Date(fromUrl);
      if (!isNaN(d)) startedAt = d.toISOString();
    }

    // 2) localStorage (сохраняем при первом заходе)
    const LS_KEY = 'horshmarny_started_at_' + (u.id || 'guest');
    if (!startedAt){
      startedAt = localStorage.getItem(LS_KEY);
    }
    if (!startedAt){
      startedAt = new Date().toISOString();
      try { localStorage.setItem(LS_KEY, startedAt); } catch(e){}
    }

    startEl.textContent = formatDate(new Date(startedAt));
  }

  function formatDate(d){
    const pad = n => String(n).padStart(2,'0');
    const day = pad(d.getDate());
    const mon = pad(d.getMonth()+1);
    const yr  = d.getFullYear();
    const hh  = pad(d.getHours());
    const mm  = pad(d.getMinutes());
    return `${day}.${mon}.${yr} · ${hh}:${mm}`;
  }

  fillProfile(user);

  // --- Копирование ID ---
  document.getElementById('copyId').addEventListener('click', async () => {
    const id = document.getElementById('profileId').textContent;
    try {
      await navigator.clipboard.writeText(id);
      if (tg && tg.HapticFeedback){
        try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      }
    } catch(e){}
  });

  // ============================================================
  // ==== Канвас с частицами ====================================
  // ============================================================
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = Math.floor(innerWidth  * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  resize();
  addEventListener('resize', resize);

  const particles = [];
  const COLORS = ['#c8102e','#8b0a1e','#ff2a4a'];
  function spawn(cx, cy, count, power){
    for (let i=0; i<count; i++){
      const a  = Math.random() * Math.PI * 2;
      const sp = (Math.random() * power + 0.4) * DPR;
      particles.push({
        x: cx*DPR, y: cy*DPR,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 1,
        decay: 0.006 + Math.random()*0.012,
        size: (Math.random()*1.6 + 0.6)*DPR,
        color: COLORS[(Math.random()*COLORS.length)|0]
      });
    }
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for (let i=particles.length-1; i>=0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.97; p.vy *= 0.97;
      p.vy += 0.008 * DPR;
      p.life -= p.decay;
      if (p.life <= 0){ particles.splice(i,1); continue; }
      ctx.globalAlpha = p.life * 0.9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }
  loop();

  setTimeout(()=>spawn(innerWidth/2, innerHeight/2, 44, 2.2), 800);
  setTimeout(()=>spawn(innerWidth/2, innerHeight/2, 32, 1.8), 1200);

  // ============================================================
  // ==== Проценты загрузки (3 сек) =============================
  // ============================================================
  const pctEl = document.getElementById('pct');
  const start = performance.now();
  const DURATION = 3000;
  const ease = t => 1 - Math.pow(1 - t, 2.2);

  (function tick(now){
    const t = Math.min((now - start) / DURATION, 1);
    if (pctEl) pctEl.textContent = Math.round(ease(t) * 100) + '%';
    if (t < 1){
      requestAnimationFrame(tick);
    } else {
      if (pctEl) pctEl.textContent = '100%';
      setTimeout(() => {
        document.getElementById('tabbar').classList.add('show');
        if (tg && tg.HapticFeedback){
          try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
        }
      }, 120);
    }
  })(performance.now());

  if (tg && tg.HapticFeedback){
    try { tg.HapticFeedback.impactOccurred('soft'); } catch(e){}
  }

  // ============================================================
  // ==== Переключение табов ====================================
  // ============================================================
  const tabs = document.querySelectorAll('.tab');
  const pages = document.querySelectorAll('.page');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      if (tab.classList.contains('active')) return;

      tabs.forEach(t => {
        const on = t === tab;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });

      pages.forEach(p => {
        p.classList.toggle('active', p.dataset.page === target);
      });

      if (tg && tg.HapticFeedback){
        try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
      }
    });
  });
})();
</script>
</body>
</html>
